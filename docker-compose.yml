# Standalone Postgres + PostGIS for openWASHdip.
# Local dev: `docker compose up -d db`. Point the app at it via DATABASE_URL (.env).
# Swap to a remote Postgres later by changing DATABASE_URL only — nothing else.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: openwashdip-db
    environment:
      POSTGRES_USER: openwashdip
      # Override on a server: set POSTGRES_PASSWORD in a .env file next to this one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openwashdip}
      POSTGRES_DB: openwashdip
    ports:
      - "5432:5432"
    volumes:
      - openwashdip_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openwashdip -d openwashdip"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The app. `docker compose up` brings up db + app together. For DB-only local dev,
  # run `docker compose up -d db` and start uvicorn on the host instead.
  app:
    build: .
    container_name: openwashdip-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://openwashdip:${POSTGRES_PASSWORD:-openwashdip}@db:5432/openwashdip
    ports:
      - "${APP_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  openwashdip_pgdata:
