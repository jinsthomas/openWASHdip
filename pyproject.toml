[project]
name = "openwashdip"
version = "0.2.0"
description = "Open-source data integrator: AI-assisted onboarding of API data sources into a standardized, scheduled, queryable store (Postgres/PostGIS), with table and map views."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.1",
    "apscheduler>=3.10",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# LLM-assisted mapping proposals. Optional: a built-in heuristic proposer works with no key.
ai = [
    "anthropic>=0.40",
]

[project.scripts]
openwashdip = "openwashdip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openwashdip"]
